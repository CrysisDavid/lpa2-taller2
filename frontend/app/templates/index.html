<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Facturas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Generador de Facturas PDF</h1>
        <form method="POST" action="{{ url_for('generar_pdf') }}">
            <div class="form-group">
                <label for="id_factura">ID de Factura:</label>
                <input type="text" id="id_factura" name="id_factura" maxlength="100"
                       placeholder="Ej. FAC-2025-001" value="{{ request.form.get('id_factura', '') }}"
                       {% if error %}aria-describedby="form-error"{% endif %} required>
            </div>
            <button type="submit">Generar PDF</button>
        </form>
        {% if error %}
            <div class="alert" id="form-error" role="alert">
                <p>{{ error }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
